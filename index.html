<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RZShop - Toko Online Official</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <div class="logo">RZ<span>Shop</span></div>
        <div class="cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count">0</span>
        </div>
    </header>

    <!-- Banner Hero -->
    <section class="hero">
        <h1>Selamat Datang di RZShop</h1>
        <p>Dapatkan produk terbaik dengan harga terjangkau!</p>
        <a href="#produk" class="btn-hero">Belanja Sekarang</a>
    </section>

    <!-- Katalog Produk -->
    <section id="produk" class="container">
        <h2 class="section-title">Produk Terpopuler</h2>
        
        <div class="product-grid">
            <!-- Kartu Produk 1 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/250" alt="Produk 1">
                <h3>Produk 1</h3>
                <p class="price">Rp 150.000</p>
                <a href="https://wa.me/6281234567890?text=Halo%20RZShop,%20saya%20ingin%20membeli%20Produk%201" class="btn-buy" target="_blank">
                    <i class="fa-brands fa-whatsapp"></i> Beli via WhatsApp
                </a>
            </div>

            <!-- Kartu Produk 2 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/250" alt="Produk 2">
                <h3>Produk 2</h3>
                <p class="price">Rp 200.000</p>
                <a href="https://wa.me/6281234567890?text=Halo%20RZShop,%20saya%20ingin%20membeli%20Produk%202" class="btn-buy" target="_blank">
                    <i class="fa-brands fa-whatsapp"></i> Beli via WhatsApp
                </a>
            </div>

            <!-- Kartu Produk 3 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/250" alt="Produk 3">
                <h3>Produk 3</h3>
                <p class="price">Rp 99.000</p>
                <a href="https://wa.me/6281234567890?text=Halo%20RZShop,%20saya%20ingin%20membeli%20Produk%203" class="btn-buy" target="_blank">
                    <i class="fa-brands fa-whatsapp"></i> Beli via WhatsApp
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 RZShop. All rights reserved.</p>
    </footer>

</body>
</html>
