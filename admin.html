<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — RZ Store</title><link rel="stylesheet" href="style.css"></head><body class="admin-body"><header class="admin-head"><a class="brand" href="index.html"><img src="assets/logo-rz.png"><span>RZ<span class="blue">STORE</span></span></a><a href="index.html">← Lihat toko</a></header><main class="admin-wrap"><div class="admin-title"><div><small class="tag">DASHBOARD ADMIN</small><h1>Kelola Produk</h1><p>Tambah dan atur katalog akun game.</p></div><div class="admin-count"><b id="adminCount">0</b><small>Produk aktif</small></div></div><section class="admin-card"><h2>＋ Tambah Akun Baru</h2><form id="productForm" class="admin-form"><label>Judul Akun<input id="pName" required placeholder="Contoh: Akun FF Sultan"></label><label>Game<select id="pGame"><option>Free Fire</option><option>Mobile Legends</option><option>Lainnya</option></select></label><label>Kategori Template<select id="pCategory"><option>Flash Sale</option><option>Akun Premium</option><option>Akun Murah</option><option>Rekomendasi</option></select></label><label>Harga Coret (Harga Normal Sebelum Diskon)<input id="pOld" type="number" min="0" placeholder="Contoh: 150000"></label><label>Harga Jual Promo<input id="pPrice" type="number" min="0" required placeholder="Contoh: 99000"></label><label>Diskon<input id="pDiscount" placeholder="Contoh: 15% OFF"></label><label>Badge Teks (Opsional)<input id="pBadge" placeholder="Contoh: BEST SELLER"></label><label class="wide">Deskripsi Singkat<input id="pDesc" required placeholder="Jelaskan isi akun dan item unggulannya"></label><label class="wide">Detail Akun / Informasi Tambahan<textarea id="pDetails" rows="4" placeholder="Contoh: Level, skin, rank, jumlah item..."></textarea></label><label class="wide">Foto Produk<input id="pImage" type="file" accept="image/*"><small>Foto akan disimpan di browser ini. Ukuran disarankan di bawah 1 MB.</small></label><button class="blue-btn wide" type="submit">Simpan Produk</button></form></section><section class="admin-card"><h2>Daftar Akun Cloud (<span id="listCount">0</span>)</h2><div id="adminList"></div></section><p class="admin-warning">Catatan: dashboard ini menyimpan data pada browser/perangkat yang sama (localStorage). Belum tersinkron ke perangkat lain atau database online.</p></main><script src="admin.js"></script></body></html>
